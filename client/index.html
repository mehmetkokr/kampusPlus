    <!-- Uygulama JavaScript'i yüklenene kadar görünen yükleme animasyonu
         (src/styles/cube-loader.css'in kopyası; React açılınca #root içeriği değişir) -->
    <!-- Temayı ilk boyamadan önce uygula: kayıtlı seçim (kp-theme), yoksa cihazın
         açık/koyu ayarı. Böylece sayfa açılırken yanlış renkte bir an görünmez. -->
    <script>
      try {
        var saved = localStorage.getItem('kp-theme');
        var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
      } catch (e) {}
    </script>
    <style id="boot-loader-style">
      /* Yalnızca <html>: body'nin rengi temadan (index.css --bg) gelir */
      html { background: #100f0d; }
      body { margin: 0; }
      html[data-theme='light'] { background: #faf8f4; }
      html[data-theme='light'] .cube-loader {
        --cl-top: #fffdf9;
        --cl-left: #b8ad9e;
        --cl-right: #d8cfc2;
        --cl-edge: rgba(60, 45, 20, 0.22);
        --cl-shadow: rgba(60, 45, 20, 0.12);
        --cl-bg: #faf8f4;
        --cl-text: rgba(34, 28, 22, 0.6);
      }
      html[data-theme='light'] .cube-loader.is-overlay { background: rgba(250, 248, 244, 0.9); }
      /* ==========================================================================
         İzometrik kayan küp yükleme animasyonu (üretilmiş dosya)
         Kaynak: client/scripts/gen-cube-loader.cjs (node scripts/gen-cube-loader.cjs src/styles). 2x2 ızgarada 3 küp sırayla boşluğa kayar;
         altlarındaki yansıma gölgeleri onları izler. Hareket azaltma açıksa durur.
         ========================================================================== */
      
      .cube-loader {
        --cl-top: #ffffff;
        --cl-left: #a7a7a7;
        --cl-right: #d4d4d4;
        --cl-edge: rgba(0, 0, 0, 0.18);
        --cl-shadow: rgba(255, 255, 255, 0.13);
        --cl-bg: #100f0d;
        --cl-text: rgba(243, 236, 225, 0.6);
        display: grid;
        place-items: center;
        gap: 28px;
        color: var(--cl-text);
      }
      
      .cube-loader.is-fullscreen,
      .cube-loader.is-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        align-content: center;
        background: var(--cl-bg);
      }
      
      .cube-loader.is-overlay {
        background: rgba(16, 15, 13, 0.9);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        animation: cl-fade 0.25s ease both;
      }
      
      .cl-stage {
        position: relative;
        width: 96px;
        height: 150px;
        transform: scale(1.5);
        transform-origin: center 40%;
      }
      
      .cl-cube,
      .cl-shadow {
        position: absolute;
        left: 24px;
        top: 0;
        width: 48px;
        height: 56px;
        animation-duration: 3.2s;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
      }
      
      .cl-cube svg,
      .cl-shadow svg { display: block; width: 48px; height: 56px; overflow: visible; }
      .cl-cube .t { fill: var(--cl-top); }
      .cl-cube .l { fill: var(--cl-left); }
      .cl-cube .r { fill: var(--cl-right); }
      .cl-cube polygon { stroke: var(--cl-edge); stroke-width: 0.6; stroke-linejoin: round; }
      
      /* Yansıma: küpün tabanının biraz altında, düzleştirilmiş koyu eşkenar dörtgen */
      .cl-shadow { top: 64px; z-index: 0 !important; }
      .cl-shadow polygon { fill: var(--cl-shadow); }
      
      .cl-a { animation-name: cl-a; }
      .cl-b { animation-name: cl-b; }
      .cl-c { animation-name: cl-c; }
      .cl-shadow.cl-a { animation-name: cl-sa; }
      .cl-shadow.cl-b { animation-name: cl-sb; }
      .cl-shadow.cl-c { animation-name: cl-sc; }
      
      .cl-label {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      
      .cl-label::after {
        content: '';
        display: inline-block;
        width: 1.2em;
        text-align: left;
        animation: cl-dots 1.6s steps(4) infinite;
      }
      
      @keyframes cl-a {
        0%, 100% { transform: translate(0px, 0px); z-index: 1; }
        16.617% { transform: translate(0px, 0px); z-index: 1; }
        16.667% { transform: translate(0px, 0px); z-index: 2; }
        19.25% { transform: translate(12px, -2px); z-index: 2; }
        21.833% { transform: translate(24px, 14px); z-index: 2; }
        41.617% { transform: translate(24px, 14px); z-index: 2; }
        41.667% { transform: translate(24px, 14px); z-index: 3; }
        44.25% { transform: translate(12px, 12px); z-index: 3; }
        46.833% { transform: translate(0px, 28px); z-index: 3; }
        66.617% { transform: translate(0px, 28px); z-index: 3; }
        66.667% { transform: translate(0px, 28px); z-index: 3; }
        69.25% { transform: translate(-12px, 12px); z-index: 3; }
        71.833% { transform: translate(-24px, 14px); z-index: 2; }
        91.617% { transform: translate(-24px, 14px); z-index: 2; }
        91.667% { transform: translate(-24px, 14px); z-index: 2; }
        94.25% { transform: translate(-12px, -2px); z-index: 2; }
        96.833% { transform: translate(0px, 0px); z-index: 1; }
      }
      @keyframes cl-b {
        0%, 100% { transform: translate(24px, 14px); z-index: 2; }
        8.283% { transform: translate(24px, 14px); z-index: 2; }
        8.333% { transform: translate(24px, 14px); z-index: 3; }
        10.917% { transform: translate(12px, 12px); z-index: 3; }
        13.5% { transform: translate(0px, 28px); z-index: 3; }
        33.283% { transform: translate(0px, 28px); z-index: 3; }
        33.333% { transform: translate(0px, 28px); z-index: 3; }
        35.917% { transform: translate(-12px, 12px); z-index: 3; }
        38.5% { transform: translate(-24px, 14px); z-index: 2; }
        58.283% { transform: translate(-24px, 14px); z-index: 2; }
        58.333% { transform: translate(-24px, 14px); z-index: 2; }
        60.917% { transform: translate(-12px, -2px); z-index: 2; }
        63.5% { transform: translate(0px, 0px); z-index: 1; }
        83.283% { transform: translate(0px, 0px); z-index: 1; }
        83.333% { transform: translate(0px, 0px); z-index: 2; }
        85.917% { transform: translate(12px, -2px); z-index: 2; }
        88.5% { transform: translate(24px, 14px); z-index: 2; }
      }
      @keyframes cl-c {
        0%, 100% { transform: translate(0px, 28px); z-index: 3; }
        0% { transform: translate(0px, 28px); z-index: 3; }
        2.583% { transform: translate(-12px, 12px); z-index: 3; }
        5.167% { transform: translate(-24px, 14px); z-index: 2; }
        24.95% { transform: translate(-24px, 14px); z-index: 2; }
        25% { transform: translate(-24px, 14px); z-index: 2; }
        27.583% { transform: translate(-12px, -2px); z-index: 2; }
        30.167% { transform: translate(0px, 0px); z-index: 1; }
        49.95% { transform: translate(0px, 0px); z-index: 1; }
        50% { transform: translate(0px, 0px); z-index: 2; }
        52.583% { transform: translate(12px, -2px); z-index: 2; }
        55.167% { transform: translate(24px, 14px); z-index: 2; }
        74.95% { transform: translate(24px, 14px); z-index: 2; }
        75% { transform: translate(24px, 14px); z-index: 3; }
        77.583% { transform: translate(12px, 12px); z-index: 3; }
        80.167% { transform: translate(0px, 28px); z-index: 3; }
      }
      @keyframes cl-sa {
        0%, 100% { transform: translate(0px, 0px); z-index: 1; }
        16.617% { transform: translate(0px, 0px); z-index: 1; }
        16.667% { transform: translate(0px, 0px); z-index: 2; }
        21.833% { transform: translate(24px, 14px); z-index: 2; }
        41.617% { transform: translate(24px, 14px); z-index: 2; }
        41.667% { transform: translate(24px, 14px); z-index: 3; }
        46.833% { transform: translate(0px, 28px); z-index: 3; }
        66.617% { transform: translate(0px, 28px); z-index: 3; }
        66.667% { transform: translate(0px, 28px); z-index: 3; }
        71.833% { transform: translate(-24px, 14px); z-index: 2; }
        91.617% { transform: translate(-24px, 14px); z-index: 2; }
        91.667% { transform: translate(-24px, 14px); z-index: 2; }
        96.833% { transform: translate(0px, 0px); z-index: 1; }
      }
      @keyframes cl-sb {
        0%, 100% { transform: translate(24px, 14px); z-index: 2; }
        8.283% { transform: translate(24px, 14px); z-index: 2; }
        8.333% { transform: translate(24px, 14px); z-index: 3; }
        13.5% { transform: translate(0px, 28px); z-index: 3; }
        33.283% { transform: translate(0px, 28px); z-index: 3; }
        33.333% { transform: translate(0px, 28px); z-index: 3; }
        38.5% { transform: translate(-24px, 14px); z-index: 2; }
        58.283% { transform: translate(-24px, 14px); z-index: 2; }
        58.333% { transform: translate(-24px, 14px); z-index: 2; }
        63.5% { transform: translate(0px, 0px); z-index: 1; }
        83.283% { transform: translate(0px, 0px); z-index: 1; }
        83.333% { transform: translate(0px, 0px); z-index: 2; }
        88.5% { transform: translate(24px, 14px); z-index: 2; }
      }
      @keyframes cl-sc {
        0%, 100% { transform: translate(0px, 28px); z-index: 3; }
        0% { transform: translate(0px, 28px); z-index: 3; }
        5.167% { transform: translate(-24px, 14px); z-index: 2; }
        24.95% { transform: translate(-24px, 14px); z-index: 2; }
        25% { transform: translate(-24px, 14px); z-index: 2; }
        30.167% { transform: translate(0px, 0px); z-index: 1; }
        49.95% { transform: translate(0px, 0px); z-index: 1; }
        50% { transform: translate(0px, 0px); z-index: 2; }
        55.167% { transform: translate(24px, 14px); z-index: 2; }
        74.95% { transform: translate(24px, 14px); z-index: 2; }
        75% { transform: translate(24px, 14px); z-index: 3; }
        80.167% { transform: translate(0px, 28px); z-index: 3; }
      }
      
      @keyframes cl-dots {
        0% { content: ''; }
        25% { content: '.'; }
        50% { content: '..'; }
        75% { content: '...'; }
      }
      
      @keyframes cl-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @media (prefers-reduced-motion: reduce) {
        .cl-cube, .cl-shadow, .cl-label::after, .cube-loader.is-overlay { animation: none !important; }
        .cl-a { transform: translate(0px, 0px); z-index: 1; }
        .cl-b { transform: translate(24px, 14px); z-index: 2; }
        .cl-c { transform: translate(0px, 28px); z-index: 3; }
      }
      
      /* Açık tema: koyu zemin yerine açık zemin, küplere ince kenar */
      [data-theme='light'] .cube-loader {
        --cl-edge: rgba(60, 40, 20, 0.35);
        --cl-left: #b9b2a7;
        --cl-right: #ddd7cd;
        --cl-shadow: rgba(60, 40, 20, 0.14);
        --cl-bg: #faf8f4;
        --cl-text: rgba(34, 28, 22, 0.6);
      }
      
      [data-theme='light'] .cube-loader.is-overlay { background: rgba(245, 240, 232, 0.92); }
      
    </style>
  </head>
  <body>
    <div id="root"><div class="cube-loader is-fullscreen" role="status" aria-live="polite"><div class="cl-stage" aria-hidden="true"><span class="cl-shadow cl-a"><svg viewBox="0 0 48 56"><polygon points="24,0 48,14 24,28 0,14"/></svg></span><span class="cl-shadow cl-b"><svg viewBox="0 0 48 56"><polygon points="24,0 48,14 24,28 0,14"/></svg></span><span class="cl-shadow cl-c"><svg viewBox="0 0 48 56"><polygon points="24,0 48,14 24,28 0,14"/></svg></span><span class="cl-cube cl-a"><svg viewBox="0 0 48 56"><polygon class="l" points="0,14 24,28 24,56 0,42"/><polygon class="r" points="24,28 48,14 48,42 24,56"/><polygon class="t" points="24,0 48,14 24,28 0,14"/></svg></span><span class="cl-cube cl-b"><svg viewBox="0 0 48 56"><polygon class="l" points="0,14 24,28 24,56 0,42"/><polygon class="r" points="24,28 48,14 48,42 24,56"/><polygon class="t" points="24,0 48,14 24,28 0,14"/></svg></span><span class="cl-cube cl-c"><svg viewBox="0 0 48 56"><polygon class="l" points="0,14 24,28 24,56 0,42"/><polygon class="r" points="24,28 48,14 48,42 24,56"/><polygon class="t" points="24,0 48,14 24,28 0,14"/></svg></span></div><p class="cl-label">Yükleniyor</p></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
