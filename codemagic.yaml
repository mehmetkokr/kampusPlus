# Telefon uygulamalarının bulutta derlenmesi (Codemagic, Mac gerekmez).
# Hesaplar açılınca Codemagic panelinde yapılacaklar (ayrıntı: client/MOBILE.md):
#  - iOS: Teams > Integrations > App Store Connect API anahtarı ("kampusplus-asc")
#         ve tr.com.kampusplus.app için otomatik imzalama
#  - Android: Code signing > Android keystore ("kampusplus-upload") ve
#         Google Play hizmet hesabı JSON'u (GCLOUD_SERVICE_ACCOUNT_CREDENTIALS)
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: kampusplus-asc
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: tr.com.kampusplus.app
    scripts:
      - name: Web derlemesi ve iOS projesine kopyalama
        script: |
          cd client
          npm ci
          npx vite build
          npx cap sync ios
      - name: İmzalama profilleri
        script: xcode-project use-profiles
      - name: Sürüm numarası
        script: |
          cd client/ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
      - name: iOS derlemesi (.ipa)
        script: |
          cd client/ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - client/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-internal:
    name: Android → Google Play (iç test)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      android_signing:
        - kampusplus-upload
      groups:
        - google_play
    scripts:
      - name: Web derlemesi ve Android projesine kopyalama
        script: |
          cd client
          npm ci
          npx vite build
          npx cap sync android
      - name: Android derlemesi (.aab)
        script: |
          cd client/android
          ./gradlew bundleRelease -PversionCode=$BUILD_NUMBER
    artifacts:
      - client/android/app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
